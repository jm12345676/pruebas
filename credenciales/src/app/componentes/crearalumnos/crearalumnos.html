<div class="pagina">

  <!-- ENCABEZADO -->
  <header class="encabezado-pagina">
    <a class="btn-pildora" routerLink="/inicio">
      <svg viewBox="0 0 24 24" class="icono">
        <line x1="20" y1="12" x2="12" y2="12"/>
        <polyline points="10,6 4,12 10,18"/>
      </svg>
      Regresar
    </a>

    <h1>Crear alumno</h1>

    <button class="btn-credencial" (click)="generarCredencial()">
      <svg viewBox="0 0 24 24" class="icono">
        <rect x="2" y="5" width="20" height="14" rx="3"/>
        <circle cx="8" cy="11" r="2"/>
        <path d="M5 16c.5-1.5 5.5-1.5 6 0"/>
        <line x1="14" y1="10" x2="19" y2="10"/>
        <line x1="14" y1="14" x2="19" y2="14"/>
      </svg>
      Generar credencial
    </button>
  </header>

  <!-- TARJETA -->
  <section class="tarjeta">
    <div class="cuerpo">

      <!-- FORMULARIO -->
      <div class="formulario">
        <div class="campo">
          <label>Apellido materno</label>
          <input type="text" [(ngModel)]="nuevo.apellidoMaterno">
        </div>
        <div class="campo">
          <label>Apellido paterno</label>
          <input type="text" [(ngModel)]="nuevo.apellidoPaterno">
        </div>
        <div class="campo">
          <label>Nombre(s)</label>
          <input type="text" [(ngModel)]="nuevo.nombres">
        </div>
        <div class="campo">
          <label>Matricula</label>
          <input type="text" [(ngModel)]="nuevo.matricula">
        </div>
        <div class="campo">
          <label>Telefono de emergencia</label>
          <input type="tel" [(ngModel)]="nuevo.telefonoEmergencia">
        </div>
        <div class="campo">
          <label>Escuela</label>
          <input type="text" [(ngModel)]="nuevo.escuela">
        </div>
        <div class="campo">
          <label>Nivel</label>
          <input type="text" [(ngModel)]="nuevo.nivel">
        </div>
        <div class="campo">
          <label>Vigencia</label>
          <input type="date" [(ngModel)]="nuevo.vigencia">
        </div>
      </div>

      <!-- ZONA DE FOTOGRAFÍA -->
      <div class="foto-zona">

        <div class="foto-caja">
          @if (nuevo.foto) {
            <img [src]="nuevo.foto" alt="Foto del alumno">
          } @else {
            <svg viewBox="0 0 100 100" class="foto-placeholder">
              <circle cx="50" cy="50" r="50"/>
              <circle cx="50" cy="38" r="14" fill="#f8fafc"/>
              <path d="M22 78c4-16 52-16 56 0 -10 12 -46 12 -56 0z" fill="#f8fafc"/>
            </svg>
          }
        </div>

        <!-- BOTONES DE FOTOGRAFÍA -->
        <div class="foto-botones">
          <input
            #archivo
            type="file"
            accept="image/*"
            hidden
            (change)="seleccionarFoto($event)">

          <button class="btn-redondo azul" title="Subir foto" (click)="archivo.click()">
            <svg viewBox="0 0 24 24" class="icono">
              <polyline points="6,11 12,5 18,11"/>
              <line x1="12" y1="5" x2="12" y2="17"/>
              <line x1="6" y1="20" x2="18" y2="20"/>
            </svg>
          </button>

          <button class="btn-redondo rojo" title="Quitar foto" (click)="quitarFoto()">
            <svg viewBox="0 0 24 24" class="icono">
              <line x1="4" y1="7" x2="20" y2="7"/>
              <path d="M6 7l1 13h10l1-13"/>
              <path d="M9 7V4h6v3"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </section>
</div>
