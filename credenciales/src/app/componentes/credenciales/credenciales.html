<div class="contenedor-principal">
  <!-- Botón Regresar ubicado en la esquina superior izquierda de toda la pantalla -->
  <a routerLink="/inicio" class="btn-regresar">
    <span class="flecha">&#8592;</span> Regresar
  </a>

  <!-- Sección Izquierda: Vista Previa -->
  <div class="seccion-previa">
    <div class="credenciales-grid">
      
      <!-- RECUADRO FRENTE -->
      <div class="credencial">
        <div class="cred-header">Frente</div>
        <div class="cred-cuerpo-img">
          <img [src]="imagenFrente()" alt="Credencial Frente" class="plantilla-credencial">
        </div>
      </div>

      <!-- RECUADRO REVERSO -->
      <div class="credencial">
        <div class="cred-header">Reverso</div>
        <div class="cred-cuerpo-img">
          <img [src]="imagenReverso()" alt="Credencial Reverso" class="plantilla-credencial">
        </div>
      </div>

    </div>
    
    <button class="btn-guardar" type="button" (click)="abrirAlerta()">Guardar Plantilla</button>
  </div>

  <!-- Sección Derecha: Panel de Control -->
  <div class="seccion-controles">
    <div class="etiqueta-estado">PAGO PENDIENTE</div>
    <button class="btn-accion" type="button">IMPRIMIR CREDENCIAL</button>
    <button class="btn-accion" type="button">CAMBIAR VIGENCIA</button>
    
    <div class="botones-secundarios">
      <button class="btn-mitad" type="button" (click)="toggleFormatos()">CAMBIAR FORMATO</button>
      <button class="btn-mitad" type="button">CAMBIAR CODIGO</button>
    </div>

    @if (mostrarFormatos()) {
      <div class="panel-formatos">
        <p class="titulo-formatos">Seleccione el diseño que desee</p>
        <div class="rejilla-formatos">
          <div class="formato-item">Diseño 1</div>
          <div class="formato-item">Diseño 2</div>
        </div>
      </div>
    }

    <div class="panel-codigos">
      <div class="qr-placeholder">QR</div>
      <div class="barras-placeholder">||||||||||</div>
    </div>
  </div>

  <!-- Modal -->
  @if (mostrarAlerta()) {
    <div class="fondo-oscuro">
      <div class="caja-alerta">
        <h3 class="alerta-titulo">¡Alumno sin alta académica!</h3>
        <p class="alerta-texto">Este alumno no ha pagado el alta académica.</p>
        <p class="alerta-texto">¿Deseas continuar?</p>
        <div class="alerta-botones">
          <button class="btn-gris" type="button" (click)="cerrarAlerta()">Cancelar</button>
          <button class="btn-azul" type="button" (click)="cerrarAlerta()">Continuar</button>
        </div>
      </div>
    </div>
  }
</div>
